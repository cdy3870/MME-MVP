# Catalog of API-hosted model offerings that candidates are drawn from (CAT-1).
#
# Hand-maintained and reviewed in pull requests. The rules live in catalog.schema.json,
# which CI checks this file against (CAT-2).
#
# !! UNVERIFIED GUESSES !! Every figure below was written without checking the provider's
# page. Each entry says whether the numbers were recalled from memory (and may be stale)
# or are a pure guess. `as_of` here is the day the placeholder was written, NOT a date the
# figures were checked. Before this catalog is used for a real run, check each entry
# against its source_url, correct it, and set as_of to the day you checked.
#
# For each offering:
#   context_window  tokens the model accepts across input and output
#   tool_support    true or false, whether it supports tool/function calling
#   regions         lowercase identifiers where the provider can serve it (e.g. us, eu)
#   prices          USD per one million tokens; cached_input is optional
#   as_of           YYYY-MM-DD, the day you checked the figures (quotes are optional)
#   source_url      the https page the figures came from, so a reviewer can verify them
#
# Each (provider, model) pair may appear only once. No retirement dates or lifecycle
# fields in the MVP.

offerings:
  # --- Anthropic -----------------------------------------------------------------------
  # Claude 5 family: PURE GUESS. Prices follow the earlier Haiku/Sonnet/Opus tiers; the
  # Fable tier is a guess at a premium tier above Opus.
  - provider: anthropic
    model: claude-haiku-5-5
    context_window: 200000
    tool_support: true
    regions: [us, eu]
    prices_usd_per_million_tokens:
      input: 1.00
      output: 5.00
      cached_input: 0.10
    as_of: "2026-10-24"
    source_url: https://docs.anthropic.com/en/docs/about-claude/pricing

