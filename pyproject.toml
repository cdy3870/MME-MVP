[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-eval"
version = "0.0.0"
description = "Model Migration Evaluator CLI, recorder and shared record models."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
migration-eval = "migration_eval.cli:app"

[project.optional-dependencies]
# Code generation tools are pinned exactly so `generate_models.py --check` gives
# the same output on every machine.
dev = [
    "datamodel-code-generator==0.85.0",
    "black==26.10.1",
    "isort==8.0.1",
    "httpx2>=2.0",  # current OpenAI/Anthropic SDKs use this; the recorder must patch it too
    "jsonschema>=4.21",
    "rfc3339-validator>=0.1.4",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
